name: Windows CI (Docker container)

# Container-based variant: builds the Windows Server container image from
# windows_docker_resources/Dockerfile and runs run_ros2_batch.py *inside* the
# container, mirroring how the Jenkins (AWS) nightly runs. This exists to
# investigate whether running in a Windows container (vs directly on the runner)
# explains infrastructural differences between Jenkins and GitHub Actions.
#
# ---------------------------------------------------------------------------
# PARITY WITH JENKINS (nightly_win_rel) -- what this file matches and what it
# deliberately cannot:
#
#   MATCHED here:
#     * Host/base Windows build 26100 (Server 2025) via runs-on: windows-2025
#       and an ltsc2025 base image tag. Jenkins host is 10.0.26100.x.
#     * --isolation=process (base build <= host build, so no Hyper-V needed).
#     * (Network) Jenkins creates a custom "isolated_network" nat network with
#       com.docker.network.bridge.enable_icc=false. That option is a Linux-bridge
#       concept and is effectively a NO-OP on Windows (HNS/Hyper-V switch), and
#       we run a SINGLE container, so it has no behavioral effect. We therefore
#       use the default nat network and skip the custom network to avoid the
#       Windows HNS "second nat network" flakiness. See notes below.
#     * --workspace-path C:\ci in CI_ARGS (Jenkins passes --workspace-path).
#     * cmake-args WITHOUT an explicit -G/-A generator (Jenkins lets the batch
#       script derive the generator from --visual-studio-version).
#
#   NOT matched (cannot be, in this repo):
#     * RTI Connext. Jenkins bakes RTI Connext 7.7.0 into its image from a
#       licensed installer and tests rmw_connextdds. This branch's Dockerfile
#       is patched to remove RTI, and we keep --ignore-rmw rmw_connextdds.
#       The MAJORITY of the Jenkins-only Windows failures are rmw_connextdds
#       shutdown crashes (exit 0xC0000005) and will therefore NOT reproduce
#       here even with identical server/network/args. Getting them back
#       requires the RTI license + Connext in the image.
#     * Hardware. Jenkins runs on AWS EC2; a hosted runner is fixed at
#       ~4 vCPU / 16 GB. CPU count affects launch-test parallelism and
#       shutdown-race timing. See the "self-hosted runner" note at the bottom
#       to remove this variable too.
# ---------------------------------------------------------------------------
#
# IMPORTANT constraints (see the Dockerfile comments):
# * The container base image (mcr.microsoft.com/windows/server:<ver>) must be
#   the SAME or OLDER than the runner host build. If older, Hyper-V isolation
#   is required for both build and run.
# * GitHub Actions' native `container:` key is Linux-only, so we drive Docker
#   manually with `docker build` / `docker run` on a Windows runner.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ros_distro:
        description: ROS 2 distribution
        default: rolling
        type: string
      isolation:
        description: Docker isolation mode (process is faster; hyperv needed if image is older than host)
        default: process
        type: choice
        options:
          - process
          - hyperv
      ci_args:
        description: Arguments passed to run_ros2_batch.py (leave blank to use the default)
        default: ''
        type: string

env:
  ROS_DISTRO: ${{ inputs.ros_distro || 'rolling' }}
  IMAGE_TAG: ros2-ci-windows:local

jobs:
  windows-ci-docker:
    # windows-2025 to match the Jenkins host kernel (Windows Server 2025, build
    # 26100). NOTE: since June 2026 the windows-2025 label defaults to the
    # Visual Studio 2026 image. Our CI_ARGS request VS 2022 / "Visual Studio 17
    # 2022"; confirm the toolchain the container needs is present (the compiler
    # lives INSIDE the container image, built by the Dockerfile, so the runner's
    # own VS version does not have to match -- but keep --visual-studio-version
    # consistent with whatever Jenkins currently uses). If you specifically need
    # the VS2022 host image, pin `windows-2022` instead (build 20348) and accept
    # that the kernel will then differ from Jenkins again.
    runs-on: windows-2025
    timeout-minutes: 350
    env:
      # The batch script requires ROS_DOMAIN_ID; forwarded into the container below.
      ROS_DOMAIN_ID: 1
      # Mirrors Jenkins' CI_ARGS as closely as possible:
      #   * adds --workspace-path C:\ci   (Jenkins passes --workspace-path)
      #   * drops -G "Visual Studio 17 2022" -A x64 from --cmake-args
      #     (Jenkins does NOT pass an explicit generator; the batch script
      #      derives it from --visual-studio-version)
      #   * keeps --ignore-rmw rmw_connextdds (no Connext in this image)
      CI_ARGS: ${{ inputs.ci_args || '--force-ansi-color --workspace-path C:\ci --ignore-rmw rmw_fastrtps_dynamic_cpp rmw_connextdds --repo-file-url https://raw.githubusercontent.com/ros2/ros2/rolling/ros2.repos --colcon-mixin-url https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml --cmake-build-type Release --visual-studio-version 2022 --build-args --event-handlers console_cohesion+ console_package_list+ --cmake-args -DINSTALL_EXAMPLES=OFF -DSECURITY=ON -DAPPEND_PROJECT_NAME_TO_INCLUDEDIR=ON --test-args --event-handlers console_cohesion+ --retest-until-pass 2 --ctest-args -LE xfail --pytest-args -m "not xfail"' }}

    steps:
      - name: Checkout ci repository
        uses: actions/checkout@v4

      # The Docker daemon is not running by default on hosted Windows runners,
      # and it must be in *Windows containers* mode to build a windows/server
      # image. Start the service and confirm the server responds in Windows mode.
      - name: Start Docker engine (Windows containers)
        shell: powershell
        run: |
          Write-Host "Services matching docker:"
          Get-Service | Where-Object { $_.Name -like '*docker*' } | Format-Table -AutoSize | Out-String | Write-Host
          # Start the Windows docker service if present.
          $svc = Get-Service -Name 'docker' -ErrorAction SilentlyContinue
          if (-not $svc) {
            Write-Error "No 'docker' Windows service found on this runner. This runner image may not support Windows containers."
            exit 1
          }
          if ($svc.Status -ne 'Running') {
            Write-Host "Starting docker service..."
            Start-Service docker
            Start-Sleep -Seconds 5
          }
          # Wait for the daemon to accept connections.
          $ok = $false
          for ($i = 0; $i -lt 12; $i++) {
            docker version --format '{{.Server.Os}}' 2>$null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Waiting for docker daemon... ($i)"
            Start-Sleep -Seconds 5
          }
          if (-not $ok) {
            Write-Error "Docker daemon did not become ready."
            exit 1
          }
          $serverOs = docker version --format '{{.Server.Os}}'
          Write-Host "Docker server OS: $serverOs"
          if ($serverOs -ne 'windows') {
            Write-Error "Docker is in '$serverOs' container mode; this image needs Windows containers. Switch the daemon to Windows containers."
            exit 1
          }
          docker info

      # Record host + docker info: the host OS build determines which base image
      # tag is compatible and whether Hyper-V isolation is required.
      - name: Report host and Docker info
        shell: powershell
        run: |
          Write-Host "== Host OS build =="
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          Write-Host ("ReleaseId    : {0}" -f $cv.ReleaseId)
          Write-Host ("CurrentBuild : {0}" -f $cv.CurrentBuild)
          Write-Host ("UBR          : {0}" -f $cv.UBR)
          try {
            $srv = Get-ItemProperty -Path 'HKLM:SOFTWARE\Microsoft\Windows NT\CurrentVersion\Update\TargetingInfo\Installed\Server.OS.amd64' -Name Version -ErrorAction Stop
            Write-Host ("Server.OS ver: {0}" -f $srv.Version)
          } catch { Write-Host "Server.OS.amd64 targeting info not present." }
          Write-Host "== docker version =="
          docker version
          Write-Host "== docker info (isolation, os) =="
          docker info

      - name: Clean up Docker
        shell: powershell
        run: docker system prune -a --volumes --force
      
      # Build the image. We pass the host's build as WINDOWS_RELEASE_VERSION so
      # the base image matches the host and process isolation can be used.
      - name: Build container image
        shell: powershell
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          # Compose a base-image tag matching the host build.
          # mcr Windows Server images are tagged by build; ltsc2025 for 26100.
          $baseTag = switch ($cv.CurrentBuild) {
            '26100' { 'ltsc2025' }        # Windows Server 2025  (matches Jenkins host)
            '20348' { 'ltsc2022' }        # Windows Server 2022
            '17763' { 'ltsc2019' }        # Windows Server 2019
            default { 'ltsc2025' }
          }
          Write-Host "Host build $($cv.CurrentBuild) -> base image tag: $baseTag"
          # For EXACT parity with Jenkins (which pins 10.0.26100.<UBR> rather
          # than the rolling ltsc alias), you can instead build a full version
          # string and pass that:
          #   $exact = "10.0.$($cv.CurrentBuild).$($cv.UBR)"
          #   --build-arg WINDOWS_RELEASE_VERSION=$exact
          # The ltsc alias is used here because it keeps process isolation valid
          # on any 26100 UBR without chasing the host's exact patch level.
          docker build `
            --isolation=${{ inputs.isolation || 'process' }} `
            --build-arg WINDOWS_RELEASE_VERSION=$baseTag `
            --build-arg ROS_DISTRO=$env:ROS_DISTRO `
            -f windows_docker_resources/Dockerfile `
            -t $env:IMAGE_TAG `
            .
          # NOTE: build context is the repo root (.) so the Dockerfile can access
          # the python scripts, exactly as the upstream comment requires.

      # Run the batch job inside the container.
      - name: Run batch job in container
        shell: powershell
        run: |
          # Mount the checkout at C:\ci so run_ros2_batch.py is present. The
          # batch job creates its workspace at C:\ci\ws inside the container; we
          # copy it out afterwards rather than mounting a nested volume (Windows
          # containers handle nested mounts poorly).
          #
          # NOTE ON --rm vs --name: Jenkins uses --rm because it bind-mounts its
          # host workspace and results land on the host directly. We instead keep
          # the container (--name ros2ci) and `docker cp` results out in the next
          # step -- this is the artifact-extraction path and does NOT change test
          # behavior. If you want byte-for-byte parity with Jenkins' invocation,
          # switch to --rm and rely solely on the bind-mounted C:\ci\ws on the
          # runner (results are already under ${{ github.workspace }} then).
          #
          # Pass CI_ARGS by NAME so Docker reads it from the environment without
          # the shell re-parsing the embedded quotes.
          docker run --name ros2ci `
            --isolation=${{ inputs.isolation || 'process' }} `
            --env CI_ARGS `
            --env ROS_DOMAIN_ID `
            -v "${{ github.workspace }}:C:\ci" `
            $env:IMAGE_TAG
          $rc = $LASTEXITCODE
          Write-Host "Container exited with code $rc"
          exit $rc

      # Copy build/test results out of the (stopped) container for artifacts,
      # even if the batch job failed. Then remove the container.
      - name: Extract results from container
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\container_out" | Out-Null
          $exists = docker ps -a --filter "name=ros2ci" --format "{{.Names}}"
          if ($exists -ne 'ros2ci') {
            Write-Host "Container 'ros2ci' not found; nothing to extract."
            exit 0
          }
          # docker cp works on stopped containers; docker exec does NOT.
          function Copy-Path($srcInContainer, $dst) {
            Write-Host "Copying $srcInContainer -> $dst"
            docker cp "ros2ci:$srcInContainer" "$dst"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "  (path not present or copy failed; continuing)"
            }
          }
          Copy-Path "C:\ci\ws\log"   "${{ github.workspace }}\container_out\log"
          Copy-Path "C:\ci\ws\build" "${{ github.workspace }}\container_out\build"
          docker rm ros2ci | Out-Null
          exit 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-ci-docker-results
          path: |
            ${{ github.workspace }}\container_out\log\**
            ${{ github.workspace }}\container_out\build\**\Testing\**
            ${{ github.workspace }}\container_out\build\**\test_results\**
            ${{ github.workspace }}\container_out\build\**\pytest.xml
          if-no-files-found: warn